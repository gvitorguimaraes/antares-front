<app-wait-icon *ngIf="loading"></app-wait-icon>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-1 sidebar">
                <div class="nav flex-column nav-pills" role="tablist">

                    <div class="nav-link">
                        <img 
                            id="antares-logo"
                            src="../assets/imgs/antares-logo.svg" 
                            alt="Antares" 
                            width="100" 
                            height="80"
                        >
                    </div>

                    <a class="nav-link" (click)="onChangeToInicio()"><i class="fa fa-university" aria-hidden="true"></i> Inicio</a>
                    <a class="nav-link" (click)="onChangeToAnotacoes()"><i class="fa fa-sticky-note" aria-hidden="true"></i> Anotações</a>
                    <!-- <a class="nav-link" (click)="onChangeToEstatisticas()"><i class="fa fa-area-chart" aria-hidden="true"></i> Estatísticas</a> -->
                    <a class="nav-link" (click)="onChangeToTarefas()"><i class="fa fa-tasks" aria-hidden="true"></i> Tarefas</a>
                    <!-- <a class="nav-link" (click)="onChangeToCalendario()"><i class="fas fa-calendar" aria-hidden="true"></i> Calendário</a> -->

                    <a class="nav-link" (click)="onChangeToPerfil()"><i class="fa fa-user" aria-hidden="true"></i> Perfil</a>
                    <a class="nav-link" (click)="logout()"><i class="fa fa-sign-out" aria-hidden="true"></i> Logout</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-11 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="dashboard-title">{{mainPageTitle}}</h1>
                        <p class="text-muted">{{data}}</p>
                    </div>
                    <div class="actions">

                        <button 
                            class="btn btn-light me-2" 
                            *ngIf="exibirBotaoPesquisa"
                        >
                            <i class="fas fa-search"></i>
                        </button>
                        
                        <button 
                            id="buttonAddNew" 
                            class="btn" 
                            *ngIf="exibirBotaoCriarNovo"
                            (action)="criar(content)"
                        >
                            <i class="fas fa-plus-circle"></i>
                        </button>

                    </div>
                    
                </div>
                <hr style="color: #B32416; background-color: #B32416; padding-bottom: 2px;">


                <!-- routes -->
                <app-tarefas *ngIf="exibicaoDeTarefas"></app-tarefas>
                <!-- routes -->
                <app-tarefas *ngIf="exibicaoDeAnotacoes"></app-tarefas>

            </div>

            <!-- Sidebar Details 
            <div class="col-3 sidebar-details">


            </div>
            -->
        </div>
        
    </div>

</body>
